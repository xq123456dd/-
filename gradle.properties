# ============================================================================
# 代理设置：本机访问不了 maven.neoforged.net（会被重置），所以构建必须走代理。
# 换代理端口的话改下面两组的端口即可（Clash 常见 7890，v2rayN 常见 10809）。
# 如果哪天网络能直连 maven.neoforged.net 了，把这 4 行注释掉可以更快。
# ============================================================================
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
# 下面这些域名直连本来就通，让它们绕开代理（减少代理抖动造成的下载失败）
systemProp.http.nonProxyHosts=libraries.minecraft.net|piston-meta.mojang.com|piston-data.mojang.com|resources.download.minecraft.net|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com|*.gradle.org|github.com|*.github.com
# ============================================================================

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# 走代理时把超时放宽、重试次数加大，避免下到一半断流直接构建失败
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=500

# Environment
# Minecraft / NeoForge 版本
# 这个版本号来自官方 1.21.1 MDK；如果想升级，到
# https://maven.neoforged.net/releases/net/neoforged/neoforge/ 查询 21.1.x 的新版本号
minecraft_version=1.21.1
# 
# minecraft_version_range=[1.21.1]      = 只允许 1.21.1（官方 MDK 的写法）
# neo_version_range=[21.1.0,21.2.0)     = 只允许 NeoForge 21.1.x（即 MC 1.21.1 专用）
# 这两个范围故意写得很窄：本模组的 Mixin 是按 1.21.1 的原版方法签名写死的，
# 换游戏版本必须重新编译，直接在别的版本上加载会启动崩溃。
minecraft_version_range=[1.21.1]
neo_version=21.1.235
neo_version_range=[21.1.0,21.2.0)
loader_version_range=[4,)

# Mod 基本信息（mod_name / mod_authors 请保持 ASCII，中文名写在 neoforge.mods.toml 里）
mod_id=locksmith
mod_name=Locksmith
mod_license=MIT
mod_version=1.0.0
mod_group_id=org.examplee.locksmith
mod_authors=YourName
mod_description=Door lock mod: lock any door with a lock, unlock it with a key.
